syntax = "proto3";
package orchestrator.register.v1;
option go_package = "github.com/Norzuiso/protocol/gen/go/orchestrator/register/v1;registerv1";

option java_multiple_files = true;
option java_package = "com.orchestrator.v1.register";
option java_outer_classname = "RegisterServiceProto";

import "google/protobuf/any.proto";


enum MessageType {
    MESSAGE_TYPE_DEFAULT = 0;
    MESSAGE_TYPE_ERROR = 1;

    // Orchestrator to Client: Get event
    MESSAGE_TYPE_REQUEST_EVENT = 2;

    // Client to orchestrator: event
    MESSAGE_TYPE_EVENT_RESPONSE = 3;

    // Orchestrator to client: distribute event to affected clients
    MESSAGE_TYPE_EVENT_DISPATCH =4;
    
    // Client to Ochestrator: Open stream to have an active connection
    MESSAGE_TYPE_OPEN_STREAM = 5;

    // Orchestrator to client: Request client status
    MESSAGE_TYPE_REQUEST_CLIENT_STATUS = 6;

    // Client to Orchestrator: Response client status
    MESSAGE_TYPE_RESPONSE_CLIENT_STATUS=7;

    // Orchestrator to client: client sent a not allow it msg type in the phase
    MESSAGE_TYPE_ERROR_PHASE=8;
    
}

message Message {
    int64 sender_id = 1;
    string content = 2;
    MessageType messageType = 3;
    int64 epoch = 4;
    map<string, google.protobuf.Any> attributes = 5;
    int64 seed = 6; 
}

message Client {
    int64 id = 1;
    string name = 2;
    optional string description = 3;
    int64 seed = 4; // the seed could have a value but if no the orchestrator assign one
}

message ConnectionRequest {
    Client client = 1;
}

message ConnectionResponse {
    Client client = 1;
}

message RegisterConnectionRequest {
    int64 from_id = 1;
    repeated int64 to_id = 2;
    map<string, google.protobuf.Any> attributes = 3;
}

message RegisterConnectionResponse {
    string response = 1;
}

service Broadcast{
    rpc ConnectClient(ConnectionRequest) returns (ConnectionResponse);
    rpc ClientToClientMessage(stream Message) returns (stream Message);
    rpc RegisterConnection(RegisterConnectionRequest) returns (RegisterConnectionResponse);
}